name: Windows package (Full and Lite)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read Tesseract lock metadata
        shell: pwsh
        run: |
          $Lock = Get-Content "packaging/windows/tesseract-bundle.lock.json" -Raw | ConvertFrom-Json
          $InstallerName = [System.IO.Path]::GetFileName("$($Lock.download_url)")
          "TESSERACT_LOCK_VERSION=$($Lock.version)" | Out-File $env:GITHUB_ENV -Append
          "TESSERACT_LOCK_SHA256=$($Lock.sha256.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append
          "TESSERACT_INSTALLER_NAME=$InstallerName" | Out-File $env:GITHUB_ENV -Append

      - name: Create Tesseract cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "build/tesseract-cache" -Force | Out-Null

      - name: Cache pinned Tesseract installer
        uses: actions/cache@v4
        with:
          path: build/tesseract-cache/${{ env.TESSERACT_INSTALLER_NAME }}
          key: windows-tesseract-installer-${{ runner.os }}-${{ env.TESSERACT_LOCK_VERSION }}-${{ env.TESSERACT_LOCK_SHA256 }}

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev]"
          python -m pip install -r packaging/windows/requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: pytest

      - name: Build standalone folder (Full)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -InstallerCacheDirectory build/tesseract-cache

      - name: Locate Full distribution
        shell: pwsh
        run: |
          $Distribution = Join-Path $PWD "build\windows\dist\SourceDocumentConverter"
          if (-not (Test-Path $Distribution -PathType Container)) {
            throw "PyInstaller distribution directory was not produced."
          }
          "DIST_DIR_FULL=$Distribution" | Out-File $env:GITHUB_ENV -Append

      - name: Verify Full package contents
        shell: pwsh
        run: |
          $RequiredFiles = @(
            "SourceDocumentConverter.exe",
            "docling-tools.exe",
            "ocrmypdf.exe",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "PACKAGING_NOTES.txt",
            "SHA256SUMS.txt",
            "tools\\tesseract\\tesseract.exe",
            "tools\\tesseract\\tessdata\\eng.traineddata",
            "tools\\tesseract\\tessdata\\osd.traineddata",
            "tools\\tesseract\\BUNDLE_INFO.txt"
          )
          foreach ($Name in $RequiredFiles) {
            $Path = Join-Path $env:DIST_DIR_FULL $Name
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Missing package file: $Name"
            }
          }

      - name: Smoke test packaged executables
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          DO_NOT_TRACK: "1"
        run: |
          $GuiPath = Join-Path $env:DIST_DIR_FULL "SourceDocumentConverter.exe"
          $GuiProcess = Start-Process -FilePath $GuiPath -ArgumentList "--package-smoke-test" -Wait -PassThru
          if ($GuiProcess.ExitCode -ne 0) {
            throw "GUI package smoke test failed with exit code $($GuiProcess.ExitCode)."
          }
          & (Join-Path $env:DIST_DIR_FULL "docling-tools.exe") --help
          if ($LASTEXITCODE -ne 0) {
            throw "Docling tools help failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR_FULL "docling-tools.exe") --runtime-check
          if ($LASTEXITCODE -ne 0) {
            throw "Docling runtime check failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR_FULL "docling-tools.exe") models download --help
          if ($LASTEXITCODE -ne 0) {
            throw "Docling model-download help failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR_FULL "ocrmypdf.exe") --version
          if ($LASTEXITCODE -ne 0) {
            throw "OCRmyPDF companion failed with exit code $LASTEXITCODE."
          }
          $BundledTesseract = Join-Path $env:DIST_DIR_FULL "tools\\tesseract\\tesseract.exe"
          if (-not (Test-Path $BundledTesseract -PathType Leaf)) {
            throw "Bundled Tesseract executable is missing."
          }
          $env:TESSDATA_PREFIX = Join-Path $env:DIST_DIR_FULL "tools\\tesseract\\tessdata"
          & $BundledTesseract --version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Tesseract version check failed with exit code $LASTEXITCODE."
          }
          $Languages = & $BundledTesseract --list-langs 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Tesseract language listing failed with exit code $LASTEXITCODE."
          }
          if ($Languages -notcontains "eng" -or $Languages -notcontains "osd") {
            throw "Bundled Tesseract missing required language data (eng, osd)."
          }
          $HocrConfig = Join-Path $env:TESSDATA_PREFIX "configs\\hocr"
          if (-not (Test-Path $HocrConfig -PathType Leaf)) {
            throw "Bundled Tesseract missing required config: tessdata/configs/hocr."
          }
          $SmokeInput = Join-Path $env:RUNNER_TEMP "tesseract-smoke.pgm"
          @(
            "P2",
            "3 3",
            "255",
            "255 255 255",
            "255 0 255",
            "255 255 255"
          ) | Set-Content -Path $SmokeInput -Encoding ascii
          $SmokeOutBase = Join-Path $env:RUNNER_TEMP "tesseract-smoke-out"
          & $BundledTesseract $SmokeInput $SmokeOutBase -l eng hocr
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Tesseract hOCR smoke test failed with exit code $LASTEXITCODE."
          }
          $HocrOutput = "$SmokeOutBase.hocr"
          if (-not (Test-Path $HocrOutput -PathType Leaf)) {
            throw "Bundled Tesseract hOCR smoke test did not produce output."
          }
          if ((Get-Content $HocrOutput -Raw).Trim().Length -eq 0) {
            throw "Bundled Tesseract hOCR smoke output is empty."
          }

      - name: Build standalone folder (Lite)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -PackageFlavor Lite -OutputDirectory build/windows-lite

      - name: Locate Lite distribution
        shell: pwsh
        run: |
          $Distribution = Join-Path $PWD "build\windows-lite\dist\SourceDocumentConverter"
          if (-not (Test-Path $Distribution -PathType Container)) {
            throw "Lite PyInstaller distribution directory was not produced."
          }
          "DIST_DIR_LITE=$Distribution" | Out-File $env:GITHUB_ENV -Append

      - name: Verify Lite package contents
        shell: pwsh
        run: |
          $RequiredFiles = @(
            "SourceDocumentConverter.exe",
            "docling-tools.exe",
            "LICENSE",
            "THIRD_PARTY_NOTICES.md",
            "PACKAGING_NOTES.txt",
            "SHA256SUMS.txt"
          )
          foreach ($Name in $RequiredFiles) {
            $Path = Join-Path $env:DIST_DIR_LITE $Name
            if (-not (Test-Path $Path -PathType Leaf)) {
              throw "Missing Lite package file: $Name"
            }
          }
          if (Test-Path (Join-Path $env:DIST_DIR_LITE "ocrmypdf.exe") -PathType Leaf) {
            throw "Lite package unexpectedly contains ocrmypdf.exe."
          }
          if (Test-Path (Join-Path $env:DIST_DIR_LITE "tools\\tesseract\\tesseract.exe") -PathType Leaf) {
            throw "Lite package unexpectedly contains bundled Tesseract."
          }
          $LiteFiles = Get-ChildItem -Path $env:DIST_DIR_LITE -File -Recurse
          $ForbiddenPatterns = @(
            "(?i)(^|[\\/])pikepdf([\\/]|$)",
            "(?i)(^|[\\/])pikepdf[^\\/]*\\.(pyd|dll)$",
            "(?i)(^|[\\/])qpdf([\\/]|$)",
            "(?i)(^|[\\/])qpdf\\.exe$",
            "(?i)(^|[\\/])libqpdf[^\\/]*\\.dll$",
            "(?i)(^|[\\/])gswin(32|64)c?\\.exe$",
            "(?i)(^|[\\/])gsdll(32|64)\\.dll$",
            "(?i)(^|[\\/])libgs[^\\/]*\\.dll$"
          )
          foreach ($File in $LiteFiles) {
            $RelativePath = $File.FullName.Substring($env:DIST_DIR_LITE.Length + 1) -replace "\\", "/"
            foreach ($Pattern in $ForbiddenPatterns) {
              if ($RelativePath -match $Pattern) {
                throw "Lite package unexpectedly contains forbidden payload: $RelativePath"
              }
            }
          }

      - name: Smoke test Lite packaged executables
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          DO_NOT_TRACK: "1"
        run: |
          $GuiPathLite = Join-Path $env:DIST_DIR_LITE "SourceDocumentConverter.exe"
          $GuiProcessLite = Start-Process -FilePath $GuiPathLite -ArgumentList "--package-smoke-test" -Wait -PassThru
          if ($GuiProcessLite.ExitCode -ne 0) {
            throw "Lite GUI package smoke test failed with exit code $($GuiProcessLite.ExitCode)."
          }
          & (Join-Path $env:DIST_DIR_LITE "docling-tools.exe") --help
          if ($LASTEXITCODE -ne 0) {
            throw "Lite docling-tools help failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR_LITE "docling-tools.exe") --runtime-check
          if ($LASTEXITCODE -ne 0) {
            throw "Lite docling runtime check failed with exit code $LASTEXITCODE."
          }
          & (Join-Path $env:DIST_DIR_LITE "docling-tools.exe") models download --help
          if ($LASTEXITCODE -ne 0) {
            throw "Lite docling model-download help failed with exit code $LASTEXITCODE."
          }

      - name: Create ZIP artifacts
        shell: pwsh
        run: |
          $ZipPathFull = Join-Path $PWD "SourceDocumentConverter-Windows-x64-Full.zip"
          Compress-Archive -Path $env:DIST_DIR_FULL -DestinationPath $ZipPathFull -CompressionLevel Optimal
          "PACKAGE_ZIP_FULL=$ZipPathFull" | Out-File $env:GITHUB_ENV -Append
          $ZipPathLite = Join-Path $PWD "SourceDocumentConverter-Windows-x64-Lite.zip"
          Compress-Archive -Path $env:DIST_DIR_LITE -DestinationPath $ZipPathLite -CompressionLevel Optimal
          "PACKAGE_ZIP_LITE=$ZipPathLite" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned development package (Full)
        uses: actions/upload-artifact@v4
        with:
          name: SourceDocumentConverter-Windows-x64-Full
          path: ${{ env.PACKAGE_ZIP_FULL }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned development package (Lite)
        uses: actions/upload-artifact@v4
        with:
          name: SourceDocumentConverter-Windows-x64-Lite
          path: ${{ env.PACKAGE_ZIP_LITE }}
          if-no-files-found: error
          retention-days: 14
