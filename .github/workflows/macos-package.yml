name: macOS package (Apple Silicon)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/macos-package.yml"
      - "packaging/macos/**"
      - "src/source_doc_converter/**"
      - "pyproject.toml"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      ARCH: arm64
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c packaging/macos/constraints-macos.txt -e ".[full,dev]"
          python -m pip install -c packaging/macos/constraints-macos.txt -r packaging/macos/requirements-build.txt

      - name: Lint
        run: ruff check .

      - name: Run packaging-related tests
        run: |
          pytest tests/test_packaging_entrypoints.py tests/test_runtime_paths.py tests/test_macos_packaging.py

      - name: Build macOS app bundle
        run: |
          chmod +x packaging/macos/build.sh packaging/macos/sign_and_notarize.sh
          ARCH=arm64 ./packaging/macos/build.sh

      - name: Verify app bundle contents
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/MacOS/SourceDocumentConverter"
          test -f "$APP_PATH/Contents/Resources/LICENSE"
          test -f "$APP_PATH/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$APP_PATH/Contents/Resources/PACKAGING_NOTES.txt"
          ! test -f "$APP_PATH/Contents/MacOS/ocrmypdf"
          ! test -f "$APP_PATH/Contents/MacOS/docling-tools"
          ! find "$APP_PATH" -type f -path "*/pikepdf/*" | grep -q .
          ! find "$APP_PATH" -type f \( -name "qpdf*.dylib" -o -name "libqpdf*.dylib" \) | grep -q .
          ! find "$APP_PATH" -type f \( -name "tesseract" -o -name "tesseract.exe" \) | grep -q .
          ! find "$APP_PATH" -type f \( -name "gs" -o -name "gswin32c.exe" -o -name "gswin64c.exe" \) | grep -q .
          file "$APP_PATH/Contents/MacOS/SourceDocumentConverter" | grep -q "arm64"
          lipo -archs "$APP_PATH/Contents/MacOS/SourceDocumentConverter" | grep -Eq '(^| )arm64( |$)'
          while IFS= read -r -d '' CANDIDATE; do
            if file "$CANDIDATE" | grep -q "Mach-O"; then
              ARCHS="$(lipo -archs "$CANDIDATE" 2>/dev/null || true)"
              echo "$CANDIDATE => $ARCHS"
              echo "$ARCHS" | grep -Eq '(^| )arm64( |$)' || {
                echo "Missing arm64 slice in bundled binary: $CANDIDATE" >&2
                exit 1
              }
            fi
          done < <(find "$APP_PATH" -type f \( -perm -111 -o -name "*.dylib" -o -name "*.so" \) -print0)
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Contents/Info.plist" | grep -q "Source Document Converter"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist" | grep -q "SourceDocumentConverter"

      - name: Smoke test packaged startup (no model downloads)
        run: |
          APP_EXEC="build/macos/dist/Source Document Converter.app/Contents/MacOS/SourceDocumentConverter"
          "$APP_EXEC" --package-smoke-test
          "$APP_EXEC" --internal-docling-tools --runtime-check
          "$APP_EXEC" --internal-docling-tools models download --help

      - name: Verify ad-hoc signature
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Evaluate signing configuration
        id: signing_config
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          required_vars=(MACOS_CERT_BASE64 MACOS_CERT_PASSWORD MACOS_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY_BASE64)
          missing=()
          present=0
          for key in "${required_vars[@]}"; do
            if [[ -n "${!key:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$key")
            fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing/notarization disabled: no signing secrets provided."
            exit 0
          fi
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "Signing/notarization misconfigured; missing: ${missing[*]}" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Optionally sign and notarize
        if: ${{ steps.signing_config.outputs.enabled == 'true' }}
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          APP_PATH="build/macos/dist/Source Document Converter.app"
          ./packaging/macos/sign_and_notarize.sh "$APP_PATH" "arm64"

      - name: Upload macOS artifact files
        uses: actions/upload-artifact@v4
        with:
          name: SourceDocumentConverter-macOS-arm64
          path: |
            build/macos/dist/SourceDocumentConverter-macOS-arm64.zip
            build/macos/dist/SourceDocumentConverter-macOS-arm64.zip.sha256
            build/macos/dist/SourceDocumentConverter-macOS-arm64.dmg
            build/macos/dist/SourceDocumentConverter-macOS-arm64.dmg.sha256
          if-no-files-found: warn
          retention-days: 14
