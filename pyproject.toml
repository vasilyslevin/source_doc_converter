[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "source-doc-converter"
version = "0.1.0a0"
description = "Local-first desktop conversion of legal PDF filings into searchable PDFs and AI-readable formats."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Vasily S. Levin" }
]
dependencies = [
  "PySide6>=6.7,<7",
  "pypdf>=5,<6"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business"
]

[project.optional-dependencies]
ocr = [
  "ocrmypdf>=17,<18"
]
docling = [
  "docling>=2,<3",
  "transformers==4.51.3"
]
full = [
  "ocrmypdf>=17,<18",
  "docling>=2,<3",
  "transformers==4.51.3"
]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.13,<1"
]

[project.scripts]
source-doc-converter = "source_doc_converter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
